<main>
  <app-hero></app-hero>
  <app-product></app-product>
  <app-promo-banner></app-promo-banner>
  <app-rental></app-rental>

  <!-- wedding-packages.component.html -->
  <section class="wedding-section">
    <div class="container">
      <!-- Header Section -->
      <div class="header-row">
        <div class="header-content">
          <div class="title-wrapper">
            <p class="sub-title">CINEMATIC COLLECTIONS</p>
            <h2 class="main-title">Wedding Photography Packages</h2>
            <div class="title-underline"></div>
          </div>
          <div class="action-wrapper">
            <a routerLink="/packages" class="action-btn outline">
              View All Collections
              <i class="bi bi-arrow-right-short"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- Packages Grid -->
      <div class="packages-grid">
        @for (pkg of displayPackages(); track pkg.id) {
          <div class="package-item">
            <div class="minimal-card" [routerLink]="['/package', pkg.id]">
              <!-- Image Section -->
              <div class="card-img-wrapper">
                <div
                  class="card-img"
                  [style.background-image]="'url(' + pkg.coverImage + ')'"
                  [attr.aria-label]="pkg.title"
                ></div>

                <div class="category-tag">{{ pkg.category }}</div>
              </div>

              <!-- Content Section -->
              <div class="card-info">
                <h3 class="package-title" [title]="pkg.title">
                  {{ pkg.title }}
                </h3>

                <div class="card-footer">
                  <div class="price-box">
                    <span class="price-label">Starting from</span>
                    <span class="price-value">₹{{ pkg.price | number }}</span>
                  </div>
                  <i class="bi bi-chevron-right arrow-icon"></i>
                </div>
              </div>
            </div>
          </div>
        }
      </div>

      <!-- Empty State (Optional) -->
      @if (displayPackages().length === 0) {
        <div class="empty-state">
          <i class="bi bi-camera"></i>
          <p>No packages available at the moment</p>
        </div>
      }
    </div>
  </section>

  <!-- Office-Profiles -->
  <!-- <app-course-grid></app-course-grid> -->
  <app-reviews></app-reviews>
</main>

<app-footer></app-footer>

<div class="floating-actions">
  <button
    class="scroll-top-btn shadow-lg"
    [class.visible]="showScroll()"
    (click)="scrollToTop()"
    aria-label="Scroll to top"
  >
    <i class="bi bi-arrow-up-short"></i>
  </button>
  <a
    href="https://wa.me/919834996139"
    target="_blank"
    class="whatsapp-btn shadow-lg"
    aria-label="Contact us on WhatsApp"
  >
    <i class="bi bi-whatsapp"></i>
  </a>
</div>
