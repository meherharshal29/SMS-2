<main>
  <app-hero></app-hero>
  <app-product></app-product>
  <app-promo-banner></app-promo-banner>
  <app-rental></app-rental>

  <!-- wedding packages -->

  <section class="wedding-section py-5">
    <div class="container">
      <div class="header-row row mb-5 align-items-center">
        <div class="col-sm-8 col-12 text-center text-sm-start">
          <p class="sub-title mb-1">CINEMATIC COLLECTIONS</p>
          <h2 class="main-title">Wedding Photography Packages</h2>
          <div class="title-underline"></div>
        </div>
        <div class="col-sm-4 col-12 text-center text-sm-end mt-4 mt-sm-0">
          <a routerLink="/packages" class="action-btn outline">
            View All Collections <i class="bi bi-arrow-right-short"></i>
          </a>
        </div>
      </div>

      <div class="row g-4">
        @for (pkg of displayPackages(); track pkg.id) {
        <div class="col-12 col-sm-6 col-lg-3 slide-in">
          <div
            class="minimal-card shadow-sm"
            [routerLink]="['/package', pkg.id]"
          >
            <div class="card-img-wrapper">
              <div
                class="card-img"
                [style.background-image]="'url(' + pkg.coverImage + ')'"
              >
                <div class="overlay">
                  <span>Explore Package</span>
                </div>
              </div>
              <div class="category-tag">{{ pkg.category }}</div>
            </div>

            <div class="card-info p-3">
              <h3>{{ pkg.title }}</h3>
              <div
                class="card-footer d-flex justify-content-between align-items-end"
              >
                <div class="price-box">
                  <span class="price-label d-block">Starting from</span>
                  <span class="price-value">₹{{ pkg.price | number }}</span>
                </div>
                <i class="bi bi-chevron-right text-muted"></i>
              </div>
            </div>
          </div>
        </div>
        }
      </div>
    </div>
  </section>

  <!-- <app-course-grid></app-course-grid> -->
  <app-reviews></app-reviews>
</main>

<app-footer></app-footer>

<div class="floating-actions">
  <button
    class="scroll-top-btn shadow-lg"
    [class.visible]="showScroll()"
    (click)="scrollToTop()"
    aria-label="Scroll to top"
  >
    <i class="bi bi-arrow-up-short"></i>
  </button>
  <a
    href="https://wa.me/919834996139"
    target="_blank"
    class="whatsapp-btn shadow-lg"
    aria-label="Contact us on WhatsApp"
  >
    <i class="bi bi-whatsapp"></i>
  </a>
</div>
