<ngx-ui-loader></ngx-ui-loader>

<div class="rental-details-wrapper" *ngIf="!loading() && camera() as cam">
  <section class="container py-4 py-md-5">
    <div class="row g-4 g-lg-5 py-4">
      <div class="col-lg-6">
        <div class="main-image-stage rounded-4">
          <img [src]="activeImage()" [alt]="cam.name" class="main-img" />
        </div>
        <div class="d-flex gap-2 mt-3 overflow-auto pb-2 custom-scrollbar">
          <div
            *ngFor="let img of cam.images"
            (click)="changeImage(img.url)"
            [class.active]="activeImage() === img.url"
            class="thumbnail-box border rounded-3 flex-shrink-0 cursor-pointer"
          >
            <img [src]="img.url" class="rounded-2" />
          </div>
        </div>
      </div>

      <div class="col-lg-6 details-column">
        <nav class="mb-2">
          <span
            class="text-uppercase text-muted fw-bold x-small letter-spacing-1"
            >{{ cam.brand }}</span
          >
        </nav>
        <h1 class="fw-bold h2 h1-md mb-1">{{ cam.name }}</h1>

        <div class="d-flex align-items-center mb-4">
          <span class="text-warning me-2">★★★★★</span>
          <span class="text-muted small"
            >({{ cam.totalReviews || 0 }} Reviews)</span
          >
        </div>

        <div class="price-card p-4 rounded-4 bg-light mb-4">
          <div class="d-flex align-items-baseline">
            <span class="h1 fw-bold mb-0">₹{{ cam.pricePerDay }}</span>
            <span class="ms-1 text-muted">/ Day</span>
          </div>
          <p class="text-secondary small mt-1 mb-0">
            * Prices exclusive of Tax
          </p>
        </div>

        <div class="mb-4">
          <h6 class="fw-bold mb-2">Description</h6>
          <p class="text-muted lh-lg">{{ cam.description }}</p>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-3 mt-auto">
          <button
            class="btn btn-rent-now flex-grow-1 py-3 fw-bold rounded-3"
            (click)="onAddToCart()"
          >
            Rent Now
          </button>
          <button class="btn btn-outline-secondary px-4 py-3 rounded-3">
            <i class="bi bi-heart me-2"></i>Wishlist
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="container mb-5">
    <h4 class="fw-bold mb-4">Technical Specifications</h4>
    <div class="specs-grid">
      <div
        class="spec-card p-3 rounded-3 bg-light"
        *ngFor="let spec of specEntries"
      >
        <label class="d-block text-uppercase text-muted fw-bold x-small mb-1">{{
          spec.label
        }}</label>
        <span class="fw-bold text-dark">{{ spec.value }}</span>
      </div>
    </div>
  </section>

  <app-rental></app-rental>
</div>

<div *ngIf="loading()" class="loading-overlay">
  <div class="spinner-border text-dark" role="status"></div>
</div>

<app-footer></app-footer>
