<!-- src/app/contact/contact-form.component.html -->
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Contact Us</h4>
    </div>
    <div class="card-body">
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            class="form-control"
            [class.is-invalid]="f['name'].touched && f['name'].invalid"
          />
          <div
            *ngIf="f['name'].touched && f['name'].invalid"
            class="invalid-feedback"
          >
            <div *ngIf="f['name'].errors?.['required']">Name is required</div>
            <div *ngIf="f['name'].errors?.['minlength']">
              Name must be at least 2 characters
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="f['email'].touched && f['email'].invalid"
          />
          <div
            *ngIf="f['email'].touched && f['email'].invalid"
            class="invalid-feedback"
          >
            <div *ngIf="f['email'].errors?.['required']">Email is required</div>
            <div *ngIf="f['email'].errors?.['email']">Invalid email format</div>
          </div>
        </div>

        <!-- Subject -->
        <div class="mb-3">
          <label for="subject" class="form-label">Subject</label>
          <input
            type="text"
            id="subject"
            formControlName="subject"
            class="form-control"
            [class.is-invalid]="f['subject'].touched && f['subject'].invalid"
          />
          <div
            *ngIf="f['subject'].touched && f['subject'].invalid"
            class="invalid-feedback"
          >
            <div *ngIf="f['subject'].errors?.['required']">
              Subject is required
            </div>
            <div *ngIf="f['subject'].errors?.['minlength']">
              Subject must be at least 5 characters
            </div>
          </div>
        </div>

        <!-- Message -->
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea
            id="message"
            formControlName="message"
            class="form-control"
            rows="5"
            [class.is-invalid]="f['message'].touched && f['message'].invalid"
          ></textarea>
          <div
            *ngIf="f['message'].touched && f['message'].invalid"
            class="invalid-feedback"
          >
            <div *ngIf="f['message'].errors?.['required']">
              Message is required
            </div>
            <div *ngIf="f['message'].errors?.['minlength']">
              Message must be at least 10 characters
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-2"
          ></span>
          Send Message
        </button>
      </form>

      <!-- Feedback -->
      <div *ngIf="successMessage" class="alert alert-success mt-3">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
    </div>
  </div>
</div>
