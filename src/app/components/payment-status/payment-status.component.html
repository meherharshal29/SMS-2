<div class="status-container">
  @if (status() === 'loading') {
  <div class="loading">
    <div class="spinner"></div>
    <p>Verifying your payment, please wait...</p>
  </div>
  } @if (status() === 'success') {
  <div class="card success">
    <i class="bi bi-check-circle-fill"></i>
    <h1>Payment Successful!</h1>
    <p>
      Your transaction ID: <strong>{{ transactionId() }}</strong>
    </p>
    <button routerLink="/rentals" class="btn">Back to Rentals</button>
  </div>
  } @if (status() === 'failed') {
  <div class="card error">
    <i class="bi bi-x-circle-fill"></i>
    <h1>Payment Failed</h1>
    <p>Something went wrong with your transaction.</p>
    <button routerLink="/cart" class="btn">Try Again</button>
  </div>
  }
</div>
