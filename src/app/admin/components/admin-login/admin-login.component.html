<div class="admin-login-container">
  <div class="admin-login-wrapper">
    <div class="login-card" [class.is-loading]="isLoading()">
      <!-- Header Section -->
      <div class="login-header text-center">
        <div class="system-icon-box mx-auto">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2 class="fw-bold text-white mb-2">ADMIN PORTAL</h2>
        <p class="text-muted small text-uppercase letter-spacing mb-0">
          Secure Access Only
        </p>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" #adminForm="ngForm" class="login-form">
        <!-- Email Field -->
        <div class="form-group">
          <label class="form-label text-muted small fw-bold">
            OPERATOR EMAIL
          </label>
          <div class="input-container">
            <i class="bi bi-person-badge"></i>
            <input
              type="email"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              (keypress)="onKeyPress($event)"
              name="email"
              class="form-control"
              placeholder="admin@smartmedia.com"
              [disabled]="isLoading()"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label text-muted small fw-bold">
            SYSTEM PASSWORD
          </label>
          <div class="input-container">
            <i class="bi bi-key-fill"></i>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              (keypress)="onKeyPress($event)"
              name="password"
              class="form-control"
              placeholder="••••••••••••"
              [disabled]="isLoading()"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [disabled]="isLoading()"
              tabindex="-1"
              aria-label="Toggle password visibility"
            >
              <i
                class="bi"
                [class.bi-eye]="!showPassword()"
                [class.bi-eye-slash]="showPassword()"
              ></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary w-100 fw-bold"
          [disabled]="isLoading() || !adminForm.valid"
        >
          <span *ngIf="!isLoading()" class="btn-content">
            <span>AUTHORIZE SESSION</span>
            <i class="bi bi-arrow-right-short"></i>
          </span>
          <span *ngIf="isLoading()" class="btn-content loading">
            <span
              class="spinner-border spinner-border-sm"
              role="status"
              aria-hidden="true"
            ></span>
            <span>AUTHENTICATING...</span>
          </span>
        </button>

        <!-- Security Notice -->
        <div class="security-notice">
          <i class="bi bi-info-circle"></i>
          <span class="notice-text">
            Authorized personnel only. All sessions are logged and monitored.
          </span>
        </div>
      </form>

      <!-- Footer Info -->
      <div class="login-footer text-center">
        <p class="mb-0 text-muted x-small">
          <i class="bi bi-shield-check"></i>
          Protected by 256-bit SSL encryption
        </p>
      </div>
    </div>

    <!-- Background Decoration -->
    <div class="background-decoration">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>
</div>
