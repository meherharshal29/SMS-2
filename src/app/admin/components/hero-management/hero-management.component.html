<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-dark text-white p-4">
          <div class="d-flex align-items-center">
            <mat-icon class="me-2">auto_awesome</mat-icon>
            <h2 class="h5 mb-0">Hero Animation Manager</h2>
          </div>
        </div>

        <div class="card-body p-4">
          <div
            class="mb-4 p-5 text-center border border-2 border-dashed rounded bg-light"
            style="cursor: pointer"
            (click)="fileInput.click()"
          >
            <mat-icon
              style="font-size: 48px; height: 48px; width: 48px"
              class="text-muted mb-2"
              >cloud_upload</mat-icon
            >
            <h3 class="h6">Select Hero Images</h3>
            <p class="text-muted small">Upload up to 10 images at once</p>

            <input
              #fileInput
              type="file"
              multiple
              (change)="onFileSelected($event)"
              accept="image/*"
              class="d-none"
            />

            <div *ngIf="selectedFiles.length > 0" class="mt-3">
              <span class="badge bg-primary rounded-pill px-3 py-2">
                {{ selectedFiles.length }} images ready for upload
              </span>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <button
                mat-flat-button
                color="primary"
                class="w-100 py-2"
                [disabled]="isUploading() || selectedFiles.length === 0"
                (click)="uploadImages('1')"
              >
                <mat-icon class="me-1">view_column</mat-icon> Upload to Column 1
              </button>
            </div>
            <div class="col-md-6">
              <button
                mat-flat-button
                color="accent"
                class="w-100 py-2"
                [disabled]="isUploading() || selectedFiles.length === 0"
                (click)="uploadImages('2')"
              >
                <mat-icon class="me-1">view_column</mat-icon> Upload to Column 2
              </button>
            </div>
          </div>

          <div *ngIf="isUploading()" class="mt-4">
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          </div>

          <div
            *ngIf="uploadMessage()"
            class="mt-4 alert d-flex align-items-center"
            [ngClass]="isError() ? 'alert-danger' : 'alert-success'"
          >
            <mat-icon class="me-2">{{
              isError() ? "error" : "check_circle"
            }}</mat-icon>
            {{ uploadMessage() }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
