<div class="container-fluid bg-light min-vh-100">
  <div class="row justify-content-start">
    <div class="col-xl-11">
      <mat-card class="newsletter-card border-0 shadow-sm">
        <mat-card-header class="pb-3 border-bottom">
          <div mat-card-avatar class="header-icon">
            <mat-icon color="primary">campaign</mat-icon>
          </div>
          <mat-card-title class="fw-bold text-dark"
            >Campaign Manager</mat-card-title
          >
          <mat-card-subtitle
            >Design professional media updates for your
            subscribers.</mat-card-subtitle
          >
        </mat-card-header>

        <mat-card-content class="pt-4">
          <form [formGroup]="newsletterForm">
            <div class="row g-3">
              <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Email Subject</mat-label>
                  <input
                    matInput
                    formControlName="subject"
                    placeholder="Inbox subject line"
                  />
                  <mat-icon matSuffix>subject</mat-icon>
                </mat-form-field>
              </div>
              <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Banner Heading</mat-label>
                  <input
                    matInput
                    formControlName="title"
                    placeholder="Main title in email"
                  />
                  <mat-icon matSuffix>title</mat-icon>
                </mat-form-field>
              </div>
              <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Introductory Message</mat-label>
                  <textarea
                    matInput
                    formControlName="body"
                    rows="3"
                    placeholder="Engage your audience..."
                  ></textarea>
                </mat-form-field>
              </div>
            </div>

            <h5 class="mt-4 mb-3 fw-bold text-secondary text-uppercase small">
              Media Grid (3 Images Required)
            </h5>
            <div class="row g-4">
              <div class="col-lg-4 col-md-6" *ngFor="let i of [1, 2, 3]">
                <div class="asset-card border rounded bg-white p-3 shadow-xs">
                  <div
                    class="preview-container mb-3"
                    (click)="imgInput.click()"
                  >
                    <img
                      *ngIf="imagePreviews[i]"
                      [src]="imagePreviews[i]"
                      class="img-fluid rounded shadow-sm"
                    />
                    <div
                      *ngIf="!imagePreviews[i]"
                      class="placeholder d-flex flex-column align-items-center justify-content-center text-muted"
                    >
                      <mat-icon class="mb-2">add_a_photo</mat-icon>
                      <span class="small">Upload Image {{ i }}</span>
                    </div>
                  </div>
                  <input
                    #imgInput
                    type="file"
                    hidden
                    (change)="onFileSelected($event, i)"
                    accept="image/*"
                  />

                  <mat-form-field appearance="fill" class="w-100 compact-field">
                    <mat-label>Action Link {{ i }}</mat-label>
                    <input
                      matInput
                      [formControlName]="'link' + i"
                      placeholder="https://..."
                    />
                    <mat-icon matSuffix>link</mat-icon>
                  </mat-form-field>
                </div>
              </div>
            </div>

            <div
              class="mt-5 pt-4 border-top d-flex flex-column flex-md-row justify-content-between align-items-center gap-4"
            >
              <div class="test-section d-flex align-items-center gap-2">
                <mat-form-field appearance="outline" class="mb-0">
                  <mat-label>Test Email</mat-label>
                  <input
                    matInput
                    type="email"
                    formControlName="targetEmail"
                    placeholder="Single recipient"
                  />
                </mat-form-field>
                <button
                  mat-stroked-button
                  color="accent"
                  type="button"
                  (click)="sendNewsletter('single')"
                  [disabled]="loading"
                >
                  SEND TEST
                </button>
              </div>

              <button
                mat-flat-button
                color="primary"
                class="send-btn py-2 px-5"
                type="button"
                (click)="sendNewsletter('all')"
                [disabled]="loading"
              >
                <mat-icon>send</mat-icon>
                BLAST TO ALL USERS
              </button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
