<div class="container mb-5">
  <mat-card class="shadow p-4">
    <h2 class="mb-4 text-primary d-flex align-items-center">
      <mat-icon class="me-2">inventory</mat-icon> Add New Rental Item
    </h2>

    <form [formGroup]="cameraForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Category</mat-label>
            <mat-select formControlName="categoryId">
              <mat-option *ngFor="let cat of categories" [value]="cat.id">
                {{ cat.name }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="cameraForm.get('categoryId')?.invalid"
              >Category is required</mat-error
            >
          </mat-form-field>
        </div>

        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Equipment Name</mat-label>
            <input
              matInput
              formControlName="name"
              placeholder="e.g. Sony Alpha a7 IV"
            />
            <mat-error *ngIf="cameraForm.get('name')?.invalid"
              >Name is required (min 3 chars)</mat-error
            >
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Brand</mat-label>
            <input matInput formControlName="brand" />
          </mat-form-field>
        </div>
        <div class="col-md-4 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Price per Day</mat-label>
            <input matInput type="number" formControlName="pricePerDay" />
            <span matPrefix>$&nbsp;</span>
          </mat-form-field>
        </div>
        <div class="col-md-4 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Model Number</mat-label>
            <input matInput formControlName="modelNumber" />
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-md-3 mb-3">
          <mat-form-field appearance="outline" class="w-100"
            ><mat-label>Resolution</mat-label
            ><input matInput formControlName="resolution"
          /></mat-form-field>
        </div>
        <div class="col-md-3 mb-3">
          <mat-form-field appearance="outline" class="w-100"
            ><mat-label>Sensor</mat-label
            ><input matInput formControlName="sensor"
          /></mat-form-field>
        </div>
        <div class="col-md-3 mb-3">
          <mat-form-field appearance="outline" class="w-100"
            ><mat-label>ISO</mat-label><input matInput formControlName="iso"
          /></mat-form-field>
        </div>
        <div class="col-md-3 mb-3">
          <mat-form-field appearance="outline" class="w-100"
            ><mat-label>Video</mat-label
            ><input matInput formControlName="video"
          /></mat-form-field>
        </div>
      </div>

      <div class="mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>
      </div>

      <div class="mb-4 p-3 border rounded bg-light">
        <label class="fw-bold mb-2 d-block"
          >Images (At least one required)</label
        >
        <button
          type="button"
          mat-raised-button
          color="accent"
          (click)="fileInput.click()"
        >
          <mat-icon>add_photo_alternate</mat-icon> Select Images
        </button>
        <input
          #fileInput
          type="file"
          (change)="onFileSelected($event)"
          multiple
          hidden
          accept="image/*"
        />

        <div class="d-flex flex-wrap mt-3 gap-3">
          <div
            *ngFor="let preview of imagePreviews; let i = index"
            class="position-relative"
          >
            <img
              [src]="preview"
              class="img-thumbnail"
              style="width: 120px; height: 120px; object-fit: cover"
            />
            <button
              type="button"
              (click)="removeImage(i)"
              class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle"
              style="transform: translate(50%, -50%)"
            >
              <mat-icon style="font-size: 18px">close</mat-icon>
            </button>
            <small class="d-block text-center mt-1" *ngIf="i === 0"
              >Primary</small
            >
          </div>
        </div>
      </div>

      <div class="d-grid">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isSubmitting"
        >
          <mat-icon class="me-2">save</mat-icon>
          {{ isSubmitting ? "Saving..." : "Save Equipment" }}
        </button>
      </div>
    </form>
  </mat-card>
</div>
