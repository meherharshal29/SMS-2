<div class="container">
  <mat-card class="shadow-sm p-3 p-md-4 mx-auto">
    <header class="mb-4 border-bottom pb-2">
      <h2
        class="text-primary d-flex justify-content-start align-items-center m-0 fw-bold"
      >
        <mat-icon class="me-2">inventory</mat-icon> Add New Rental Item
      </h2>
      <p class="text-muted small m-0 mt-1">
        Fill in the details to add equipment to the rental fleet.
      </p>
    </header>

    <form
      [formGroup]="cameraForm"
      (ngSubmit)="onSubmit()"
      class="container-fluid p-0"
    >
      <div class="row g-3 mb-3">
        <div class="col-12 col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Category</mat-label>
            <mat-select formControlName="categoryId">
              <mat-option *ngFor="let cat of categories" [value]="cat.id">
                {{ cat.name }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="cameraForm.get('categoryId')?.invalid"
              >Category is required</mat-error
            >
          </mat-form-field>
        </div>

        <div class="col-12 col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Equipment Name</mat-label>
            <input
              matInput
              formControlName="name"
              placeholder="e.g. Sony Alpha a7 IV"
            />
            <mat-error *ngIf="cameraForm.get('name')?.invalid"
              >Name is required (min 3 chars)</mat-error
            >
          </mat-form-field>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-12 col-sm-6 col-md-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Brand</mat-label>
            <input matInput formControlName="brand" />
          </mat-form-field>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Price per Day</mat-label>
            <input matInput type="number" formControlName="pricePerDay" />
            <span matPrefix>$&nbsp;</span>
          </mat-form-field>
        </div>
        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Model Number</mat-label>
            <input matInput formControlName="modelNumber" />
          </mat-form-field>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Resolution</mat-label>
            <input matInput formControlName="resolution" />
          </mat-form-field>
        </div>
        <div class="col-6 col-md-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Sensor</mat-label>
            <input matInput formControlName="sensor" />
          </mat-form-field>
        </div>
        <div class="col-6 col-md-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>ISO</mat-label>
            <input matInput formControlName="iso" />
          </mat-form-field>
        </div>
        <div class="col-6 col-md-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Video</mat-label>
            <input matInput formControlName="video" />
          </mat-form-field>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Description</mat-label>
            <textarea
              matInput
              rows="3"
              formControlName="description"
            ></textarea>
          </mat-form-field>
        </div>
      </div>

      <div class="mb-4 p-3 border rounded bg-light">
        <label class="fw-bold mb-2 d-block"
          >Images (At least one required)</label
        >

        <button
          type="button"
          mat-stroked-button
          color="primary"
          (click)="fileInput.click()"
          class="mb-3"
        >
          <mat-icon>add_photo_alternate</mat-icon> Select Images
        </button>

        <input
          #fileInput
          type="file"
          (change)="onFileSelected($event)"
          multiple
          hidden
          accept="image/*"
        />

        <div class="d-flex flex-wrap gap-3 mt-2 overflow-auto pb-2">
          <div
            *ngFor="let preview of imagePreviews; let i = index"
            class="position-relative"
          >
            <div
              class="preview-container shadow-sm border rounded overflow-hidden bg-white"
            >
              <img
                [src]="preview"
                class="img-fluid"
                style="width: 100px; height: 100px; object-fit: cover"
              />
              <button
                type="button"
                (click)="removeImage(i)"
                class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle d-flex align-items-center justify-content-center p-0"
                style="width: 24px; height: 24px; margin: -10px"
              >
                <mat-icon style="font-size: 16px; width: 16px; height: 16px"
                  >close</mat-icon
                >
              </button>
            </div>
            <span
              class="badge bg-dark position-absolute bottom-0 start-50 translate-middle-x mb-1"
              *ngIf="i === 0"
              style="font-size: 10px"
              >Primary</span
            >
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-md-4 ms-auto">
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="isSubmitting"
            class="w-100 py-2"
          >
            <mat-icon class="me-2">save</mat-icon>
            {{ isSubmitting ? "Saving..." : "Save Equipment" }}
          </button>
        </div>
      </div>
    </form>
  </mat-card>
</div>
