<!-- src/app/admin/messages/message-list.component.html -->
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Admin - Contact Messages</h2>
    <button
      class="btn btn-primary"
      (click)="loadMessages()"
      [disabled]="loading"
    >
      <span
        *ngIf="loading"
        class="spinner-border spinner-border-sm me-2"
      ></span>
      Refresh
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center my-5">
    <div
      class="spinner-border text-primary"
      style="width: 3rem; height: 3rem"
      role="status"
    >
      <span class="visually-hidden">Loading messages...</span>
    </div>
    <p class="mt-3 text-muted">Loading messages...</p>
  </div>

  <!-- Error State -->
  <div
    *ngIf="error && !loading"
    class="alert alert-danger d-flex justify-content-between align-items-center"
  >
    <div><strong>Error:</strong> {{ error }}</div>
    <button class="btn btn-outline-danger btn-sm" (click)="loadMessages()">
      Retry
    </button>
  </div>

  <!-- Empty State -->
  <div
    *ngIf="!loading && !error && messages.length === 0"
    class="alert alert-info text-center"
  >
    <i class="bi bi-inbox fs-1"></i>
    <p class="mt-3">No messages received yet.</p>
  </div>

  <!-- Messages Table -->
  <div
    class="table-responsive"
    *ngIf="!loading && !error && messages.length > 0"
  >
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Email</th>
          <th>Subject</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let msg of messages"
          class="clickable-row"
          (click)="viewMessage(msg.id)"
          [class.table-primary]="msg.status === 'unread'"
        >
          <td>{{ msg.createdAt | date : "medium" }}</td>
          <td>
            <strong>{{ msg.name }}</strong>
          </td>
          <td>{{ msg.email }}</td>
          <td>{{ msg.subject }}</td>
          <td>
            <span [class]="getStatusBadge(msg.status)">
              {{ msg.status.toUpperCase() }}
            </span>
          </td>
          <td>
            <button
              class="btn btn-sm btn-outline-primary"
              (click)="$event.stopPropagation(); viewMessage(msg.id)"
            >
              View
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
