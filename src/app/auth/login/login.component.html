<app-loader></app-loader>

<div class="auth-card">
  <h2>Welcome Back</h2>

  @if (!showOtpStep()) {
  <p class="subtitle">Login to access your studio dashboard</p>
  } @else {
  <p class="subtitle">
    We sent a code to <strong>{{ email() }}</strong>
  </p>
  } @if (!showOtpStep()) {
  <form (ngSubmit)="requestOtp()">
    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        placeholder="name@smartmedia.com"
        required
      />
    </div>

    <button type="submit" class="btn-auth">Send Login Code</button>
  </form>
  } @else {
  <div class="otp-container">
    <div class="form-group">
      <label>Enter Verification Code</label>
      <input
        type="text"
        [ngModel]="otp()"
        (ngModelChange)="otp.set($event)"
        maxlength="6"
        placeholder="000000"
        name="otp"
      />
    </div>

    <button class="btn-auth" (click)="verifyOtp()">Verify & Login</button>

    <div class="resend" (click)="goBack()">
      <i class="bi bi-arrow-left"></i> Wrong email? Go back
    </div>
  </div>
  }

  <div class="toggle-link">
    Don't have an account? <a routerLink="/auth/register">Register Here</a>
  </div>
</div>
