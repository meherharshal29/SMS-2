<ngx-ui-loader></ngx-ui-loader>
<div class="auth-card">
  <h2>Join Us</h2>
  <p class="subtitle" *ngIf="!showOtpStep">Create your Smart Media account</p>
  <p class="subtitle" *ngIf="showOtpStep">Verify your account to continue</p>

  <form *ngIf="!showOtpStep" (ngSubmit)="registerUser()">
    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        [(ngModel)]="user.name"
        name="name"
        placeholder="John Doe"
        required
      />
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        [(ngModel)]="user.email"
        name="email"
        placeholder="name@example.com"
        required
      />
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input
        type="tel"
        [(ngModel)]="user.phone"
        name="phone"
        placeholder="+91 98765 43210"
        required
      />
    </div>

    <button type="submit" class="btn-auth">Get Verification Code</button>
  </form>

  <div class="otp-container" *ngIf="showOtpStep">
    <div class="form-group">
      <label>Enter OTP sent to {{ user.email }}</label>
      <input type="text" [(ngModel)]="otp" maxlength="6" placeholder="000000" />
    </div>

    <button class="btn-auth" (click)="verifyOtp()">Verify Account</button>

    <div class="resend" (click)="showOtpStep = false">Edit Details</div>
  </div>

  <div class="toggle-link">
    Already have an account? <a routerLink="/auth/login">Login Here</a>
  </div>
</div>
