<app-loader></app-loader>

<ngx-ui-loader></ngx-ui-loader>

<div class="auth-card py-4 mt-5">
  <h2>Join Us</h2>

  @if (!showOtpStep()) {
    <p class="subtitle">Create your Smart Media account</p>

    <form (ngSubmit)="registerUser()">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
          placeholder="enter name"
          required
        />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          placeholder="name@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="tel"
          [maxLength]="10"
          [ngModel]="phone()"
          (ngModelChange)="phone.set($event)"
          name="phone"
          placeholder="+91"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          placeholder="Min. 6 characters"
          required
        />
      </div>

      <button type="submit" class="btn-auth">Get Verification Code</button>
    </form>
  } @else {
    <p class="subtitle">Verify your account to continue</p>

    <div class="otp-container">
      <div class="form-group">
        <label
          >Enter 6-digit OTP sent to <br />
          <strong>{{ email() }}</strong></label
        >
        <input
          type="text"
          [ngModel]="otp()"
          (ngModelChange)="otp.set($event)"
          maxlength="6"
          placeholder="000000"
          required
        />
      </div>

      <button class="btn-auth" (click)="verifyOtp()">Verify Account</button>

      <div class="resend" (click)="goBackToDetails()">
        <i class="bi bi-pencil-square"></i> Edit Details
      </div>
    </div>
  }

  <div class="toggle-link">
    Already have an account? <a routerLink="/auth/login">Login Here</a>
  </div>
</div>
